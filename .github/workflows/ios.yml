name: iOS app

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/NashaGalereya.xcodeproj -scheme NashaGalereya \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NashaGalereya.app Payload/
          zip -qry NashaGalereya.ipa Payload
          ls -la NashaGalereya.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NashaGalereya-ipa
          path: NashaGalereya.ipa

      - name: Publish to the "ios-app" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-app >/dev/null 2>&1 || \
            gh release create ios-app --title "Наша галерея — приложение для iPhone" \
              --notes "Установка: см. ios/README.md"
          gh release upload ios-app NashaGalereya.ipa --clobber
